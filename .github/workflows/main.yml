name: Gerar APK Controle do Noah

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Organizar pastas e ficheiros Gradle
        run: |
          mkdir -p app/src/main/java/com/noah/controle
          mkdir -p app/src/main/assets
          if [ -f MainActivity.kt ]; then mv MainActivity.kt app/src/main/java/com/noah/controle/; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          if [ -f index.html ]; then mv index.html app/src/main/assets/; fi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "ControleDoNoah"
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.noah.controle"
              compileSdk 34
              defaultConfig {
                  applicationId "com.noah.controle"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/**"
                      excludes += "META-INF/**"
                  }
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.github.MuntashirAkon:libadb-android:3.1.1"
              implementation "org.conscrypt:conscrypt-android:2.5.3"
              implementation "org.bouncycastle:bcpkix-jdk15to18:1.81"
          }
          EOF

      - name: Gerar icone do app
        run: |
          SRC="Controle_remoto_do_Noah.png"
          if [ ! -f "$SRC" ]; then echo "ERRO: envie o arquivo $SRC para a raiz do repositorio"; exit 1; fi
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          IM=$(command -v magick || command -v convert || true)
          if [ -z "$IM" ]; then echo "ERRO: ImageMagick nao foi encontrado"; exit 1; fi
          RES=app/src/main/res
          $IM -size 1254x1254 xc:none -fill white -draw "roundrectangle 0,0 1253,1253 260,260" /tmp/mask.png
          $IM "$SRC" -alpha set /tmp/mask.png -compose DstIn -composite /tmp/round.png
          for spec in mdpi:108:78 hdpi:162:117 xhdpi:216:156 xxhdpi:324:234 xxxhdpi:432:312; do
            IFS=: read d canvas art <<< "$spec"
            mkdir -p $RES/mipmap-$d
            $IM /tmp/round.png -resize ${art}x${art} -background none -gravity center -extent ${canvas}x${canvas} $RES/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > $RES/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F8CE9</color>
          </resources>
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Controle-do-Noah-APK
          path: app/build/outputs/apk/debug/app-debug.apk
