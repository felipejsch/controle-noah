name: Gerar APK Controle do Noah

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Organizar estrutura de pastas automaticamente
        run: |
          mkdir -p app/src/main/java/com/noah/controle
          mkdir -p app/src/main/assets
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/noah/controle/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f index.html ] && mv index.html app/src/main/assets/

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.noah.controle'
              compileSdk 34
              defaultConfig {
                  applicationId "com.noah.controle"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packaging {
                  resources {
                      excludes += '/META-INF/{AL2.0,LGPL2.1}'
                      excludes += 'META-INF/DEPENDENCIES'
                      excludes += 'META-INF/INDEX.LIST'
                      excludes += 'META-INF/io.netty.versions.properties'
                  }
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'dev.mobile:dadb:1.2.7'
          }
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Controle-do-Noah-APK
          path: app/build/outputs/apk/debug/app-debug.apk
