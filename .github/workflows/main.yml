name: Gerar APK Controle do Noah

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Organizar pastas e ficheiros Gradle
        run: |
          mkdir -p app/src/main/java/com/noah/controle
          mkdir -p app/src/main/assets
          if [ -f MainActivity.kt ]; then mv MainActivity.kt app/src/main/java/com/noah/controle/; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          if [ -f index.html ]; then mv index.html app/src/main/assets/; fi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "ControleDoNoah"
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.noah.controle"
              compileSdk 34
              defaultConfig {
                  applicationId "com.noah.controle"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/**"
                      excludes += "META-INF/**"
                  }
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.github.MuntashirAkon:libadb-android:3.1.1"
              implementation "org.conscrypt:conscrypt-android:2.5.3"
              implementation "org.bouncycastle:bcpkix-jdk15to18:1.81"
          }
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Controle-do-Noah-APK
          path: app/build/outputs/apk/debug/app-debug.apk
